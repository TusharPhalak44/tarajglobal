services:

  db:
    image: mysql:8.0
    container_name: tarajglobal_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-tarajglobal}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tarajglobal_server
    restart: always
    env_file: ./server/.env
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-tarajglobal}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3001}
    depends_on:
      - db
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: tarajglobal_client
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - server
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
