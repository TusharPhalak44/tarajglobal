services:

  db:
    image: mysql:8.0
    container_name: tarajglobal_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tarajglobal
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tarajglobal_server
    restart: always
    env_file: ./server/.env
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=tarajglobal
      - DB_PORT=3306
      - CLIENT_URL=http://localhost:3001
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=tgs.admin001@gmail.com
      - EMAIL_PASSWORD=mxxg rgnm vcli bdtn
      - EMAIL_FROM=tgs.admin001@gmail.com
      - ADMIN_EMAIL=tgs.admin001@gmail.com
      - CAREER_EMAIL=hr@tarajglobal.com
      - HR_EMAIL=hr@tarajglobal.com
    depends_on:
      - db
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: tarajglobal_client
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - server
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data: