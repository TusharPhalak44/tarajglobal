server {
    listen 80;
    client_max_body_size 50M;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # API requests → Node.js backend
    location /api {
    proxy_pass http://server:5001;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    # Uploaded files → Node.js backend
    location /uploads {
        proxy_pass http://server:5001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic sitemap (includes published blog posts)
    location = /sitemap.xml {
        proxy_pass http://server:5001/api/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Long-lived caching for hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # React application. Prerendered routes live at /<route>/index.html; serving them
    # without $uri/ avoids nginx's trailing-slash 301 that would break canonical URLs.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }

    # Ensure index.html is never cached
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}